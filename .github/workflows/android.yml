name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Download on-device vocal separation model
        run: bash scripts/download_spleeter_model.sh

      - name: Run unit tests and build APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          echo "APK_NAME=MelodyVisualizer-v${VERSION_NAME}-debug.apk" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${VERSION_NAME}" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "MelodyVisualizer-v${VERSION_NAME}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MelodyVisualizer-${{ env.RELEASE_TAG }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" \
              --target "$GITHUB_SHA" \
              --title "Melody Visualizer $RELEASE_TAG" \
              --generate-notes
          fi
